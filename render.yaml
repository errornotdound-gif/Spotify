services:
  - type: web
    name: spotify-scam
    runtime: python
    repo: https://github.com/errornotdound-gif/Spotify
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app