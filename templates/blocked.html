<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#f5f5f5;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial,sans-serif}
        .container{text-align:center;padding:40px}
        .spinner{width:40px;height:40px;border:4px solid #e0e0e0;border-top-color:#1db954;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 20px}
        @keyframes spin{to{transform:rotate(360deg)}}
        p{color:#666;font-size:14px}
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Verifying your connection...</p>
    </div>
    <script>
        window.location.href = 'https://www.google.com';
    </script>
</body>
</html>
